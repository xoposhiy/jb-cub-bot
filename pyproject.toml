[project]
name = "jbcub-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavel Egorov", email = "pe.xoposhiy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "alembic>=1.18.5",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
